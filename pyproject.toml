[project]
name = "rag-chatbot"
version = "0.1.0"
description = "Chatbot RAG sur des documents, propulsé par Claude"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.5",
    "fastembed>=0.9.1",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "numpy>=2.5.4",
    "pypdf>=5.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag", "src/foot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# Depends(...) en valeur par défaut est la façon officielle d'écrire FastAPI.
extend-immutable-calls = ["fastapi.Depends"]
